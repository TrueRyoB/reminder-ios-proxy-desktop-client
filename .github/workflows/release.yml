name: Release

# macOS releases are ad-hoc signed. They are not Developer ID signed or
# notarized, so the release notes must retain the Gatekeeper installation note.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release from (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: gui

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          args: --bundles dmg
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: reminder ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false

      - name: Verify ad-hoc signature and write checksum
        run: |
          APP=$(find gui/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'Signature=adhoc'
          shasum -a 256 gui/src-tauri/target/release/bundle/dmg/*.dmg > SHA256SUMS-macos.txt

      - name: Attach macOS checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.inputs.tag || github.ref_name }}" SHA256SUMS-macos.txt --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch runs against a branch by default; check out the
          # tag being released so the built version matches the tag.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: gui

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: reminder ${{ github.event.inputs.tag || github.ref_name }}
          # Draft so the artifacts can be checked before anything is public.
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## インストール

            `reminder_<version>_x64-setup.exe`(NSIS・ユーザー単位インストール)を推奨します。
            MSI 版も同梱していますが、通常は不要です。

            **コード署名をしていないため、初回起動時に Windows SmartScreen の警告が出ます。**
            「詳細情報」→「実行」で進めてください。

            ## 前提

            - Windows 10/11 x64
            - Apple ID(2ファクタ認証)。パスワードは Windows 資格情報マネージャーに保存されます
            - 通知はアプリが常駐している間だけ発火します(Apple はリマインダー向けの
              プッシュ機構を公開していないため)

            ## 注意

            Apple の非公開 CloudKit API を利用しています。仕様変更で動作しなくなる
            可能性があります。自己責任でご利用ください。
