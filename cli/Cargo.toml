[package]
name = "reminder-proxy-client"
version = "0.1.0"
edition = "2024"
description = "CLI for the iCloud Reminders private CloudKit API client (debugging/verification tool; the Tauri GUI is the primary consumer)."
license = "MIT"

[[bin]]
name = "reminder-proxy-client"
path = "src/main.rs"

[dependencies]
reminder-core = { path = "../core" }
reqwest = { version = "0.12", features = ["json", "cookies"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
keyring = "3"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
