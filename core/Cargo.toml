[package]
name = "reminder-core"
version = "0.1.1"
edition = "2024"
description = "iCloud Reminders private CloudKit API client: auth, CRUD, reorder, CRDT text encoding."
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json", "cookies"] }
reqwest_cookie_store = "0.8"
cookie_store = { version = "0.21", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
num-bigint-dig = { version = "0.8", features = ["rand"] }
num-traits = "0.2"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
tracing = "0.1"
tokio = { version = "1", features = ["time"] }
prost = "0.13"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
# `windows-native` is NOT a default feature: keyring 3's cfg cascade falls back
# to `pub use mock as default` (an in-process, non-persistent store) when no
# backend feature is on. The desktop app only removes legacy entries; it never
# writes an Apple ID password.
keyring = { version = "3", features = ["windows-native"] }
# DPAPI (CryptProtectData) for at-rest encryption of the persisted session --
# see src/dpapi.rs. Win32_Foundation is needed for LocalFree, which frees the
# buffers DPAPI returns.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The Keychain keeps only the per-install encryption key. Session files remain
# in the existing data directory, encrypted with authenticated encryption.
keyring = { version = "3", features = ["apple-native"] }
chacha20poly1305 = "0.10"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# Uses WinRT on Windows and macOS UserNotifications on macOS. Windows-specific
# AUMID registration stays in `notify.rs` behind `cfg(windows)`.
notify-rust = "4"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
chacha20poly1305 = "0.10"
