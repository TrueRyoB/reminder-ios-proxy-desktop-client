[package]
name = "reminder-core"
version = "0.1.0"
edition = "2024"
description = "iCloud Reminders private CloudKit API client: auth, CRUD, reorder, CRDT text encoding."
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json", "cookies"] }
reqwest_cookie_store = "0.8"
cookie_store = { version = "0.21", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
num-bigint-dig = { version = "0.8", features = ["rand"] }
num-traits = "0.2"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
keyring = "3"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
tracing = "0.1"
tokio = { version = "1", features = ["time"] }
prost = "0.13"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
notify-rust = "4"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
