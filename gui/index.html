<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>iCloud Reminders</title>
  </head>
  <body>
    <div id="app">
      <div class="view view-main view-init safe-areas">
        <div class="page">
          <div class="navbar">
            <div class="navbar-bg"></div>
            <div class="navbar-inner">
              <div class="title">iCloud Reminders</div>
            </div>
          </div>
          <div class="page-content">
            <div id="status-block" class="block block-strong-ios inset-ios text-align-center">
              <p>読み込み中…</p>
            </div>
          </div>
        </div>
      </div>

      <div id="login-sheet" class="sheet-modal">
        <div class="sheet-modal-inner">
          <div class="page-content">
            <div class="block-title">Apple IDでログイン</div>
            <form id="login-form">
              <div class="list inset-ios">
                <ul>
                  <li class="item-content item-input">
                    <div class="item-inner">
                      <div class="item-title item-label">Apple ID</div>
                      <div class="item-input-wrap">
                        <input id="login-apple-id" type="email" autocomplete="username" required />
                      </div>
                    </div>
                  </li>
                  <li class="item-content item-input">
                    <div class="item-inner">
                      <div class="item-title item-label">パスワード</div>
                      <div class="item-input-wrap">
                        <input id="login-password" type="password" autocomplete="current-password" required />
                      </div>
                    </div>
                  </li>
                </ul>
              </div>
              <p id="login-error" class="text-color-red text-align-center"></p>
              <div class="block">
                <button type="submit" class="button button-fill button-large">ログイン</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div id="two-factor-sheet" class="sheet-modal">
        <div class="sheet-modal-inner">
          <div class="page-content">
            <div class="block-title">確認コードを入力</div>
            <p class="block">信頼済みデバイスに送信された6桁のコードを入力してください。</p>
            <form id="two-factor-form">
              <div class="list inset-ios">
                <ul>
                  <li class="item-content item-input">
                    <div class="item-inner">
                      <div class="item-title item-label">確認コード</div>
                      <div class="item-input-wrap">
                        <input id="two-factor-code" type="text" inputmode="numeric" maxlength="6" required />
                      </div>
                    </div>
                  </li>
                </ul>
              </div>
              <p id="two-factor-error" class="text-color-red text-align-center"></p>
              <div class="block">
                <button type="submit" class="button button-fill button-large">確認</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
